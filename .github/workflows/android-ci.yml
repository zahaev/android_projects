name: Android CI

on:
  push:
    branches:
      - develop
      - master
      - "feature/**"
      - "test/**"
      - "refactor/**"
      - "chore/**"

  pull_request:
    branches:
      - develop
      - master

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JDK
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ============================================================
      # UNIT TESTS
      # ============================================================

      - name: Run unit tests
        run: ./gradlew test

      # ============================================================
      # LINT
      # ============================================================

      - name: Run lint
        run: ./gradlew lint

      # ============================================================
      # DEBUG BUILD
      # ============================================================

      - name: Assemble debug
        run: ./gradlew assembleDebug
